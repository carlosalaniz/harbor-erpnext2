# ERPNext (custom build) as a Harbor app. Same services and service names as the original
# Compose stack, so a copied site's common_site_config.json keeps working; the one-shot services
# (configurator, create-site, apply-theme) live in the backend's start script instead.
services:
  frontend:
    build: {context: ../image}
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: erpnext2:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: erp2.local
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
    depends_on:
      erpnext2: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}

  erpnext2:
    build: {context: ../image}
    command: [/home/frappe/harbor/backend-start.sh]
    environment:
      SITE_NAME: erp2.local
      FRAPPE_SITE_NAME_HEADER: X-Frappe-Site-Name
    depends_on:
      erpnext2-db: {condition: service_healthy}
      erpnext2-redis-cache: {condition: service_started}
      erpnext2-redis-queue: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}
      - {type: volume, source: logs, target: /home/frappe/frappe-bench/logs}

  websocket:
    build: {context: ../image}
    command: [node, apps/frappe/socketio.js]
    depends_on:
      erpnext2: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}
      - {type: volume, source: logs, target: /home/frappe/frappe-bench/logs}

  scheduler:
    build: {context: ../image}
    command: [bench, schedule]
    depends_on:
      erpnext2: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}
      - {type: volume, source: logs, target: /home/frappe/frappe-bench/logs}

  worker-default:
    build: {context: ../image}
    command: [bench, worker, --queue, default]
    depends_on:
      erpnext2: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}
      - {type: volume, source: logs, target: /home/frappe/frappe-bench/logs}

  worker-short:
    build: {context: ../image}
    command: [bench, worker, --queue, short]
    depends_on:
      erpnext2: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}
      - {type: volume, source: logs, target: /home/frappe/frappe-bench/logs}

  worker-long:
    build: {context: ../image}
    command: [bench, worker, --queue, long]
    depends_on:
      erpnext2: {condition: service_started}
    volumes:
      - {type: volume, source: sites, target: /home/frappe/frappe-bench/sites}
      - {type: volume, source: assets, target: /home/frappe/frappe-bench/assets}
      - {type: volume, source: logs, target: /home/frappe/frappe-bench/logs}

  erpnext2-db:
    image: mariadb@sha256:31c1aa20ba2d78c4cbc45b2675e40ffd6a3cd59897a9767ce88fc284309f55ab
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - {type: volume, source: mariadb, target: /var/lib/mysql}

  erpnext2-redis-cache:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065

  erpnext2-redis-queue:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065

volumes:
  sites: {}
  assets: {}
  logs: {}
  mariadb: {}
